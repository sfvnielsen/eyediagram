[metadata]
name = eyediagram
version = 0.1.2  # Update this to match the version in your __init__.py
description = Tools for plotting an eye diagram. All credit should go to WW.
author = Warren Weckesser, Søren Føns Nielsen
license = BSD
classifiers =
    License :: OSI Approved :: BSD License
    Intended Audience :: Developers
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Cython

[options]
packages = find:
install_requires =
    numpy >= 1.6.0
    scipy

[options.packages.find]
where = .

[options.extras_require]
dev =
    Cython

[build_ext]
inplace = 1

[extensions]
eyediagram._brescount =
    eyediagram/brescount.pyx
    include_dirs=numpy.get_include()
