[build-system]
requires = ["setuptools", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "eyediagram"
version = "0.1.2"
description = "Tools for plotting an eye diagram. All credit should go to WW."
authors = [
    { name = "Warren Weckesser" },
    { name = "Søren Føns Nielsen" }
]
license = { text = "BSD" }
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Cython"
]
dependencies = [
    "numpy >= 1.6.0",
    "scipy"
]

[tool.setuptools]
packages = ["eyediagram"]

[tool.setuptools.extension]
module = "eyediagram._brescount"
sources = ["eyediagram/brescount.pyx"]
include-dirs = ["{numpy.get_include()}"]